<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI 视频作品集</title>
<meta name="description" content="AI 视频作品集 · 在线播放" />
<link rel="stylesheet" href="assets/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <h1 id="site-title">AI 视频作品集</h1>
    <p id="site-sub" class="sub">AI 生成 · 在线观看</p>
  </div>
</header>

<main class="wrap">
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden>
    还没有视频。把 mp4 放进 <code>media/</code>，然后在 <code>videos.js</code> 里登记一条。
  </p>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span id="site-foot">Made with AI</span>
  </div>
</footer>

<!-- 播放器弹层 -->
<div id="modal" class="modal" hidden aria-hidden="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-body" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-close" data-close aria-label="关闭">✕</button>
    <video id="player" controls playsinline preload="metadata" crossorigin="anonymous"></video>
    <div class="modal-meta">
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
    </div>
  </div>
</div>

<script src="videos.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
